<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="School Management System">
    <meta name="author" content="Jeudi Samuel">

    <title>Student Registration</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/images/logo.jpg">
</head>

<body>
            <!-- Sidebar -->

    <div class="container">

        <aside class="sidebar">

            <nav>
                <ul>

                    <li>
                        <a href="registration.html">Student Registration</a>
                    </li>

                    <li>
                        <a href="list.html">
                            Student List
                        </a>
                    </li>

                </ul>
            </nav>

        </aside>

<!-- Main Content -->

        <main class="main-content">

            <u><h1>ENREGISTRER UN ELEVE</h1></u>

            <form id="studentForm">

<!--==== SECTION 1 ====-->

                <section class="form-section active">

                    <h2>Information Personnelle</h2>

                    <!--==== PHOTO + QR CODE ====-->

                    <div class="student-profile">

                        <!--==== STUDENT PHOTO ====-->

                        <div class="student-photo">

                            <label for="student_photo">
                                Photo de l'élève
                            </label>

                            <div class="photo-preview">

                                <img
                                    id="photoPreview"
                                    src=""
                                    alt="Photo de l'élève"
                                >

                            </div>

                            <input
                                type="file"
                                id="student_photo"
                                name="student_photo"
                                accept="image/*"
                            >

                        </div>


<!--==== QR CODE ====-->

                        <div class="student-qrcode">

                            <label>
                                QR Code
                            </label>

                            <div id="qrCode"></div>

                        </div>

                    </div>
                    <div class="form-group">
                        <label for="student_id">ID tudiant:</label>
                        <input
                            type="text"
                            id="student_id"
                            name="student_id"
                            placeholder="Généré automatiquement"
                            readonly>
                    </div>

                    <div class="form-group">
                        <label for="first_name">Prénom</label>
                        <input 
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="Saisissez le prénom"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="last_name">Nom:</label>
                        <input 
                            type="text"
                            id="last_name"
                            name="last_name"
                            placeholder="saississez le nom"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="date_of_birth">Date de naissance:</label>
                        <input
                            type="date"
                            id="date_of_birth"
                            name="date_of_birth"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="place_of_birth">Lieu de naissance:</label>
                        <input
                            type="text"
                            id="place_of_birth"
                            name="place_of_birth"
                            placeholder="Saisissez le lieu de naissance"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="gender">Sexe:</label>
                        <select id="gender" name="gender" required>
                            <option value="">Sélectionnez le sexe</option>            
                            <option value="male">Masculin</option>
                            <option value="female">Féminin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nationality">Nationalité:</label>
                        <input
                            type="text"
                            id="nationality"
                            name="nationality"
                            placeholder="Saisissez la nationalité"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="student_photo">Photo de l'élève:</label>
                            <input
                                type="file"
                                id="student_photo"
                                name="student_photo"
                                accept="image/*"
                            >
                    </div>

                    <div class="form-group">
                        <label for="phone">Numéro de téléphone:</label>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Saisissez le numéro de téléphone"
                                required
                            >
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse e-mail:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Saisissez l'adresse e-mail"
                        >
                    </div>

                    <div class="form-group">
                        <label for="address">Adresse:</label>
                        <textarea
                            id="address"
                            name="address"
                            placeholder="Saisissez l'adresse"
                            rows="3"
                            required>
                        </textarea>
                    </div>

                    <div class="form-group">
                        <label for="city">Ville:</label>
                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Saisissez la ville"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="state">État / Province:</label>
                        <input
                            type="text"
                            id="state"
                            name="state"
                            placeholder="Saisissez l'État ou la Province"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="postal_code">Code postal:</label>
                        <input
                            type="text"
                            id="postal_code"
                            name="postal_code"
                            placeholder="Saisissez le code postal"
                        >
                    </div>

                    <div class="form-group">

                        <label for="blood_type">Groupe sanguin:</label>
                        <select id="blood_type" name="blood_type">
                            <option value="">Sélectionnez le groupe sanguin</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

<!-- Bouton -->
                    <div class="section-actions">
                        <button 
                            type="button" 
                            class="btn-next">Suivant →
                        </button>
                    </div>

                </section>


<!--==== SECTION 2 ====-->
                <section class="form-section">

                    <h2>Informations Académiques</h2>

                    <div class="form-group">
                        <label for="academic_year">Année académique :</label>
                        <select id="academic_year" name="academic_year">
                            <option value="">Sélectionner</option>
                            <option value="2025-2026">2025-2026</option>
                            <option value="2026-2027">2026-2027</option>
                            <option value="2027-2028">2027-2028</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="level">Niveau:</label>

                        <select
                            id="level"
                            name="level"
                            required>

                            <option value="">Sélectionnez le niveau</option>
                            <option value="fondamental_1">Fondamentale 1</option>
                            <option value="fondamental_2">Fondamentale 2</option>
                            <option value="fondamental_3">Fondamentale 3</option>
                            <option value="prescolaire">Préscolaire</option>
                            <option value="secondaire">Secondaire</option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="grade">Classe :</label>
                        <select id="grade" name="grade">
                            <option value="">Petite Section (PS)</option>
                            <option value="">Moyenne Section (MS)</option>
                            <option value="">Grande Section (GS)</option>
                            <option value="1ere">1ère année</option>
                            <option value="2eme">2ème année</option>
                            <option value="3eme">3ème année</option>
                            <option value="4eme">4ème année</option>
                            <option value="5eme">5ème année</option>
                            <option value="6eme">6ème année</option>
                            <option value="7eme">7ème année</option>
                            <option value="8eme">8ème année</option>
                            <option value="9eme">9ème année</option>
                            <option value="NS1">NS1</option>
                            <option value="NS2">NS2</option>
                            <option value="NS3">NS3</option>
                            <option value="NS4">NS4</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="enrollment_date">Date d'inscription :</label>
                        <input type="date" id="enrollment_date" name="enrollment_date">
                    </div>

                    <!-- Boutons -->
                    <div class="section-actions">

                        <button type="button" class="btn-prev">
                            ← Précédent
                        </button>

                        <button type="button" class="btn-next">
                            Suivant →
                        </button>

                    </div>

                </section>


                <!--==== SECTION 3 ====-->
                <section class="form-section">

                    <h2>Parents et Responsable</h2>

                    <div class="form-group">
                        <label for="parents_marital_status">
                            Situation familiale :
                        </label>

                        <select id="parents_marital_status"
                                name="parents_marital_status">

                            <option value="">Sélectionner</option>
                            <option value="married">Mariés</option>
                            <option value="divorced">Divorcés</option>
                            <option value="separated">Séparés</option>
                            <option value="widowed">Veuf / Veuve</option>
                            <option value="single">Célibataire</option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mother_first_name">
                            Prénom de la mère :
                        </label>

                        <input type="text"
                            id="mother_first_name"
                            name="mother_first_name">
                    </div>

                    <div class="form-group">
                        <label for="father_first_name">
                            Prénom du père :
                        </label>

                        <input type="text"
                            id="father_first_name"
                            name="father_first_name">
                    </div>

                    <!-- Boutons -->
                    <div class="section-actions">

                        <button type="button" class="btn-prev">
                            ← Précédent
                        </button>

                        <button type="button" class="btn-next">
                            Suivant →
                        </button>

                    </div>

                </section>


                <!--==== SECTION 4 ====-->
                <section class="form-section">

                    <h2>Paiement des frais d'inscription</h2>

                    <div class="form-group">
                        <label for="registration_fee">
                            Frais d'inscription :
                        </label>

                        <input type="number"
                            id="registration_fee"
                            name="registration_fee">
                    </div>

                    <div class="form-group">
                        <label for="payment_method">
                            Mode de paiement :
                        </label>

                        <select id="payment_method"
                                name="payment_method">

                            <option value="">Sélectionner</option>
                            <option value="cash">Espèces</option>
                            <option value="bank">Virement bancaire</option>
                            <option value="check">Chèque</option>

                        </select>
                    </div>

                    <!-- Boutons -->
                    <div class="section-actions">

                        <button 
                            type=
                            "button" class=
                            "btn-prev">← Précédent
                        </button>

                        <button 
                            type="submit" 
                            class="btn-submit">Enregistrer
                        </button>

                    </div>

                </section>

            </form>

        </main>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="../assets/js/registration.js"></script>

</body>

</html>
